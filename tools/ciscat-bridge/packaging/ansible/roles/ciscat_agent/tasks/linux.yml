---
- name: Final package or installer
  ansible.builtin.set_fact:
    ciscat_final: "{{ '-assessor-' in ciscat_package_linux }}"

- name: Package folder, root only
  ansible.builtin.file:
    path: '/opt/ciscat/install/{{ ciscat_version }}'
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Unpack the agent package
  ansible.builtin.unarchive:
    src: '{{ ciscat_release_dir }}/{{ ciscat_package_linux }}'
    dest: '/opt/ciscat/install/{{ ciscat_version }}'
    owner: root
    group: root
  when: ciscat_package_url | length == 0 and not ciscat_final

- name: Unpack the final agent package in / (owners and modes as in the package)
  ansible.builtin.unarchive:
    src: '{{ ciscat_release_dir }}/{{ ciscat_package_linux }}'
    dest: /
  when: ciscat_package_url | length == 0 and ciscat_final

- name: Download the agent package (SHA-256 checked)
  ansible.builtin.get_url:
    url: '{{ ciscat_package_url | regex_replace("/+$", "") }}/{{ ciscat_package_linux }}'
    dest: '/opt/ciscat/install/{{ ciscat_version }}/{{ ciscat_package_linux }}'
    checksum: 'sha256:{{ ciscat_package_sha256_linux }}'
    owner: root
    group: root
    mode: '0600'
  when: ciscat_package_url | length > 0

- name: Unpack the downloaded agent package
  ansible.builtin.unarchive:
    src: '/opt/ciscat/install/{{ ciscat_version }}/{{ ciscat_package_linux }}'
    dest: '/opt/ciscat/install/{{ ciscat_version }}'
    remote_src: true
    owner: root
    group: root
  when: ciscat_package_url | length > 0 and not ciscat_final

- name: Unpack the downloaded final agent package in /
  ansible.builtin.unarchive:
    src: '/opt/ciscat/install/{{ ciscat_version }}/{{ ciscat_package_linux }}'
    dest: /
    remote_src: true
  when: ciscat_package_url | length > 0 and ciscat_final

- name: Master public key pinned for the bootstrap (final package), from the master
  ansible.builtin.copy:
    content: '{{ ciscat_master_keys.results[0].content | b64decode }}'
    dest: /var/lib/wazuh-ciscat/ciscat-manifest.pub
    owner: root
    group: root
    mode: '0644'
  when: ciscat_final and ciscat_master_host | length > 0

- name: Master public key next to the installer, from the master
  ansible.builtin.copy:
    content: '{{ ciscat_master_keys.results[0].content | b64decode }}'
    dest: '/opt/ciscat/install/{{ ciscat_version }}/agent-linux/ciscat-manifest.pub'
    owner: root
    group: root
    mode: '0644'
  when: not ciscat_final and ciscat_master_host | length > 0

- name: Master public key next to the installer, from the release folder
  ansible.builtin.copy:
    src: '{{ ciscat_pubkey_linux }}'
    dest: '/opt/ciscat/install/{{ ciscat_version }}/agent-linux/ciscat-manifest.pub'
    owner: root
    group: root
    mode: '0644'
  when: not ciscat_final and ciscat_master_host | length == 0 and ciscat_pin_pubkey | bool

- name: Install or update (idempotent; the output lists what changed)
  ansible.builtin.command:
    cmd: sh install-linux-agent.sh
    chdir: '/opt/ciscat/install/{{ ciscat_version }}/agent-linux'
  register: ciscat_install
  changed_when: true
  failed_when: ciscat_install.rc != 0 or 'RESULT:' not in ciscat_install.stdout
  when: not ciscat_final

- name: Installer output
  ansible.builtin.debug:
    var: ciscat_install.stdout_lines
  when: not ciscat_final
