---
- name: Final package or installer
  ansible.builtin.set_fact:
    ciscat_final: "{{ '-assessor-' in ciscat_package_windows }}"

# set before a final package is unpacked: its files then inherit these rights, not those of C:\
- name: C:\CIS owned by Administrators, writable only by SYSTEM and Administrators
  ansible.windows.win_shell: |
    New-Item -ItemType Directory -Force "C:\CIS\install\{{ ciscat_version }}" | Out-Null
    & icacls.exe C:\CIS /inheritance:r /grant:r "*S-1-5-18:(OI)(CI)F" "*S-1-5-32-544:(OI)(CI)F" "*S-1-5-32-545:(OI)(CI)RX" /C /Q
    & icacls.exe C:\CIS /setowner "*S-1-5-32-544" /T /C /Q
  changed_when: false

- name: Copy the agent package
  ansible.windows.win_copy:
    src: '{{ ciscat_release_dir }}/{{ ciscat_package_windows }}'
    dest: "C:\\CIS\\install\\{{ ciscat_version }}\\{{ ciscat_package_windows }}"
  when: ciscat_package_url | length == 0

- name: Download the agent package (SHA-256 checked)
  ansible.windows.win_get_url:
    url: '{{ ciscat_package_url | regex_replace("/+$", "") }}/{{ ciscat_package_windows }}'
    dest: "C:\\CIS\\install\\{{ ciscat_version }}\\{{ ciscat_package_windows }}"
    checksum: '{{ ciscat_package_sha256_windows }}'
    checksum_algorithm: sha256
  when: ciscat_package_url | length > 0

- name: Unpack the agent package
  ansible.windows.win_shell: >-
    Expand-Archive -Force -Path "C:\CIS\install\{{ ciscat_version }}\{{ ciscat_package_windows }}"
    -DestinationPath "{{ 'C:\\' if ciscat_final else 'C:\\CIS\\install\\' + ciscat_version }}"
  changed_when: false

- name: Master public key pinned for the bootstrap (final package), from the master
  ansible.windows.win_copy:
    content: '{{ ciscat_master_keys.results[1].content | b64decode }}'
    dest: "C:\\Program Files (x86)\\ossec-agent\\active-response\\bin\\ciscat-manifest.pub.xml"
  when: ciscat_final and ciscat_master_host | length > 0

- name: Master public key next to the installer, from the master
  ansible.windows.win_copy:
    content: '{{ ciscat_master_keys.results[1].content | b64decode }}'
    dest: "C:\\CIS\\install\\{{ ciscat_version }}\\agent-windows\\ciscat-manifest.pub.xml"
  when: not ciscat_final and ciscat_master_host | length > 0

- name: Master public key next to the installer, from the release folder
  ansible.windows.win_copy:
    src: '{{ ciscat_pubkey_windows }}'
    dest: "C:\\CIS\\install\\{{ ciscat_version }}\\agent-windows\\ciscat-manifest.pub.xml"
  when: not ciscat_final and ciscat_master_host | length == 0 and ciscat_pin_pubkey | bool

- name: Install or update (idempotent; the output lists what changed)
  ansible.windows.win_shell: >-
    powershell -NoProfile -ExecutionPolicy Bypass -File .\install-windows-agent.ps1
    {% if ciscat_copy_assessor_from %}-CopyAssessorFrom "{{ ciscat_copy_assessor_from }}"{% endif %}
  args:
    chdir: "C:\\CIS\\install\\{{ ciscat_version }}\\agent-windows"
  register: ciscat_install
  changed_when: true
  failed_when: ciscat_install.rc != 0 or 'RESULT:' not in ciscat_install.stdout
  when: not ciscat_final

- name: Installer output
  ansible.builtin.debug:
    var: ciscat_install.stdout_lines
  when: not ciscat_final
