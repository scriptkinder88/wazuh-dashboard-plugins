---
# Bridge version of the packages, and the folder holding the release attachments on the
# controller: the agent packages (and master/agent-keys/ciscat-manifest.pub{,.xml} when pinned)
ciscat_version: '2.3.0'
ciscat_release_dir: '{{ playbook_dir }}/release'
# package file names (the full packages carry the Assessor: -assessor-<version>)
ciscat_package_linux: 'ciscat-agent-linux-{{ ciscat_version }}.tar.gz'
ciscat_package_windows: 'ciscat-agent-windows-{{ ciscat_version }}.zip'
# The agents get the master's public key with the group files and keep the first one
# (trust on first use). true: install it with the agent instead (pinned before any sync).
ciscat_pin_pubkey: false
ciscat_pubkey_linux: '{{ ciscat_release_dir }}/agent-keys/ciscat-manifest.pub'
ciscat_pubkey_windows: '{{ ciscat_release_dir }}/agent-keys/ciscat-manifest.pub.xml'
# Windows only: CIS-CAT Pro already installed elsewhere on the host, copied to C:\CIS\Assessor
ciscat_copy_assessor_from: ''
