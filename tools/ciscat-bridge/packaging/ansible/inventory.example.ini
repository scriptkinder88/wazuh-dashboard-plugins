# Copy to inventory.ini and list the agents. Windows hosts are reached through WinRM (HTTPS);
# keep credentials in Ansible Vault, never in this file.
[ciscat_linux]
# rhel-agent-01.example.internal

[ciscat_windows]
# win-agent-01.example.internal

[ciscat_windows:vars]
ansible_connection=winrm
ansible_winrm_transport=kerberos
ansible_port=5986
ansible_winrm_server_cert_validation=validate
