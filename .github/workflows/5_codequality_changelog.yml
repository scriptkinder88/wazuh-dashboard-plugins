name: Wazuh 5.x / Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

concurrency:
  group: wazuh-5x-changelog-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-changelog:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Decide whether changelog is required
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          if gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name' | grep -qx 'no-changelog'; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "Skipping because the no-changelog label is present."
            exit 0
          fi

          changed_files=$(gh pr diff "$PR_NUMBER" --repo "$REPO" --name-only)
          printf '%s\n' "$changed_files"

          non_ci_files=$(printf '%s\n' "$changed_files" | grep -Ev '^\.github/' || true)
          if [ -z "$non_ci_files" ]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "Skipping changelog for workflow-only changes."
            exit 0
          fi

          echo "required=true" >> "$GITHUB_OUTPUT"

      - name: Verify CHANGELOG.md was updated
        if: steps.changelog.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          changed_files=$(gh pr diff "$PR_NUMBER" --repo "$REPO" --name-only)
          if ! grep -qx 'CHANGELOG.md' <<< "$changed_files"; then
            echo "::error::This PR changes runtime/source files but does not modify CHANGELOG.md. Add a changelog entry or apply the 'no-changelog' label."
            exit 1
          fi
          echo "CHANGELOG.md was updated."
