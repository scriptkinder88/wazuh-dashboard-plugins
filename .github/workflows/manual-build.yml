# This workflow builds a production-ready package from the given Git reference.
# Any branch, tag or commit SHA existing in the origin can be used.
#
# This workflow is based on the `dev-environment` workflow.

name: Manual build

on:
  pull_request:
    branches:
      - '4.*'
  workflow_call:
    inputs:
      reference:
        required: true
        type: string
        default: main
        description: Source code reference (branch, tag or commit SHA)
  workflow_dispatch:
    inputs:
      reference:
        required: true
        type: string
        default: main
        description: Source code reference (branch, tag or commit SHA)

concurrency:
  group: manual-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  # Build an app package from the given source code reference.
  build:
    name: Build app package
    uses: ./.github/workflows/dev-environment.yml
    permissions:
      pull-requests: write
    with:
      reference: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.reference }}
      command: 'yarn build'
      artifact_name: 'wazuh-dashboard-plugins'
    secrets: inherit

  test-packages:
    needs: build
    name: Test packages
    runs-on: ubuntu-24.04

    steps:
      - name: Step 01 - Download the plugin's source code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.reference }}
          path: wazuh

      - name: Step 02 - Set variables
        run: |
          echo "githubReference=$(echo ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.reference }} | sed 's/\//-/g')" >> $GITHUB_ENV
          echo "currentDir=$(pwd -P)" >> $GITHUB_ENV
          echo "version=$(jq -r '.version' $(pwd)/wazuh/plugins/main/package.json)" >> $GITHUB_ENV
          echo "revision=$(jq -r '.revision' $(pwd)/wazuh/plugins/main/package.json)" >> $GITHUB_ENV
          echo "versionPlatform=$(jq -r '.pluginPlatform.version' $(pwd)/wazuh/plugins/main/package.json)" >> $GITHUB_ENV

      - name: Step 03 - Download built plugin artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wazuh-dashboard-plugins_*
          path: ${{ env.currentDir }}/wazuh/scripts/test-packages/plugins
          merge-multiple: true

      - name: Step 04 - Verify downloaded packages
        run: |
          find "${{ env.currentDir }}/wazuh/scripts/test-packages/plugins" -maxdepth 1 -type f -name '*.zip' -print
          test "$(find "${{ env.currentDir }}/wazuh/scripts/test-packages/plugins" -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 3

      - name: Step 05 - Build the Docker image
        run: |
          echo "current=${{ env.currentDir }}"
          cd ./wazuh/scripts/test-packages
          docker build --build-arg OSD_VERSION=${{ env.versionPlatform }} -f osd-test-packages.Dockerfile ./
