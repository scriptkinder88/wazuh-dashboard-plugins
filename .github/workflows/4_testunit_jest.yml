# Fork-compatible Wazuh 4.x Jest workflow.
# Uses the official Wazuh OpenSearch Dashboards development image instead of
# Wazuh's private CodeBuild runner.
name: (4.x) Run unit test

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      reference:
        required: true
        type: string
        default: 4.14.7
        description: Source code reference (branch, tag or commit SHA)
  pull_request:
    branches:
      - 4.*
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  focused:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Requirement-specific SCA tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.reference || github.sha }}

      - name: Run focused Jest in official Wazuh dev environment
        shell: bash
        run: |
          set -euo pipefail
          sudo chown 1000:1000 -R plugins/main
          platform_version=$(jq -r '.pluginPlatform.version' plugins/main/package.json)

          docker run -t --rm \
            -e OPENSEARCH_DASHBOARDS_VERSION="${platform_version}" \
            -v "$(pwd)/plugins/main:/home/node/kbn/plugins/wazuh" \
            quay.io/wazuh/osd-dev:"${platform_version}" \
            bash -c '
              set -euo pipefail
              yarn config set registry https://registry.yarnpkg.com
              cd /home/node/kbn/plugins/wazuh
              yarn install --non-interactive
              yarn test:jest --coverage=false --runTestsByPath \
                server/lib/reporting/sca-request.test.ts \
                server/lib/reporting/sca-report.test.ts \
                server/lib/reporting/sca-multi-server-wiring.test.ts \
                server/routes/wazuh-reporting.test.ts \
                public/components/common/modules/modules-defaults.test.tsx
            '

  regression:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Full Jest regression suite
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.reference || github.sha }}

      - name: Run full Jest suite in official Wazuh dev environment
        shell: bash
        run: |
          set -euo pipefail
          sudo chown 1000:1000 -R plugins/main
          platform_version=$(jq -r '.pluginPlatform.version' plugins/main/package.json)

          docker run -t --rm \
            -e OPENSEARCH_DASHBOARDS_VERSION="${platform_version}" \
            -v "$(pwd)/plugins/main:/home/node/kbn/plugins/wazuh" \
            quay.io/wazuh/osd-dev:"${platform_version}" \
            bash -c '
              set -euo pipefail
              yarn config set registry https://registry.yarnpkg.com
              cd /home/node/kbn/plugins/wazuh
              yarn install --non-interactive
              yarn test:jest --coverage=false
            '
