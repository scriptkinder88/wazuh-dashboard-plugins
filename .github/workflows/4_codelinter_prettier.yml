# Fork-compatible Wazuh 4.x Prettier workflow.
name: (4.x) Prettier

permissions:
  contents: write

on:
  pull_request:
    branches:
      - 4.*
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  prettier:
    name: Ensure the code format on the changed files
    runs-on: ubuntu-24.04
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Verify the changed files
        shell: bash
        run: |
          set -euo pipefail
          CHANGED_FILES=$(git diff --name-only --diff-filter=d             "${{ github.event.pull_request.base.sha }}"             "${{ github.event.pull_request.head.sha }}")

          echo "Changed files:"
          printf '%s\n' "$CHANGED_FILES"

          plugin_package_json=$(ls -d plugins/* | head -n1)
          yarn --cwd "$plugin_package_json" --modules-folder ../../node_modules

          if [ -n "$CHANGED_FILES" ]; then
            printf '%s\n' "$CHANGED_FILES" | xargs npx prettier --write --ignore-unknown
            if ! git diff --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add $CHANGED_FILES
              git commit -m "Format SCA coverage validation"
              git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
            fi
            printf '%s\n' "$CHANGED_FILES" | xargs npx prettier --check --ignore-unknown
          else
            echo "No changed files to check."
          fi
