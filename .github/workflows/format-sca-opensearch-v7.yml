name: Format indexed SCA reporting v7

on:
  push:
    branches:
      - fix/sca-opensearch-report-4.14.7-v7

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/sca-opensearch-report-4.14.7-v7

      - name: Format indexed SCA files
        shell: bash
        run: |
          set -euo pipefail
          npx --yes prettier@2.7.1             plugins/main/public/react-services/reporting.js             plugins/main/server/lib/reporting/sca-multi-server-wiring.test.ts             plugins/main/server/lib/reporting/sca-report.test.ts             plugins/main/server/lib/reporting/sca-report.ts             plugins/main/server/lib/reporting/sca-request.test.ts             plugins/main/server/lib/reporting/sca-request.ts             --write --config .prettierrc

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             plugins/main/public/react-services/reporting.js             plugins/main/server/lib/reporting/sca-multi-server-wiring.test.ts             plugins/main/server/lib/reporting/sca-report.test.ts             plugins/main/server/lib/reporting/sca-report.ts             plugins/main/server/lib/reporting/sca-request.test.ts             plugins/main/server/lib/reporting/sca-request.ts
          git commit -m "Format indexed SCA reporting"
          git push
