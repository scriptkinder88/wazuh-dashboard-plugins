# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# ESLint is a tool for identifying and reporting on patterns
# found in ECMAScript/JavaScript code.
# More details at https://github.com/eslint/eslint
# and https://eslint.org

name: ESLint

on:
  pull_request:
    branches-ignore:
      - 2.*
      - 3.*
    types: [opened, synchronize, reopened, ready_for_review]
jobs:
  linter:
    name: Ensure the code format on the changed files
    runs-on: ubuntu-24.04
    if: github.event.pull_request.draft == false
    steps:
      # https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # - https://github.com/actions/setup-node/blob/main/docs/advanced-usage.md#node-version-file
      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Verify the changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          CHANGED_FILES=$(git diff --name-only --diff-filter=d "$BASE_SHA" "$HEAD_SHA" | grep -E '\.[jt]sx?$' || true)
          echo "Changed files:"
          printf '%s\n' "$CHANGED_FILES"
          if [ -z "$CHANGED_FILES" ]; then
            echo "No JavaScript or TypeScript files changed."
            exit 0
          fi
          echo "Installing dependencies"
          plugin_package=$(ls -d plugins/* | head -n 1)
          yarn --cwd "$plugin_package" --modules-folder ../../node_modules
          echo "Running eslint on the changed files"
          printf '%s\n' "$CHANGED_FILES" | xargs -r npx eslint
