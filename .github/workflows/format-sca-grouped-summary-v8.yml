name: Format SCA grouped summary v8

on:
  push:
    branches:
      - fix/sca-grouped-summary-4.14.7-v8

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sca-grouped-summary-4.14.7-v8
      - name: Install dependencies
        shell: bash
        run: |
          SKIP_DOWNLOAD_INDEXER_RESOURCES=true yarn --cwd plugins/main --modules-folder ../../node_modules
      - name: Format changed SCA files
        shell: bash
        run: |
          npx prettier             plugins/main/server/lib/reporting/sca-report.ts             plugins/main/server/lib/reporting/sca-report.test.ts             --write --config .prettierrc
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/main/server/lib/reporting/sca-report.ts plugins/main/server/lib/reporting/sca-report.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "Format grouped SCA report summary"
          git push origin HEAD:fix/sca-grouped-summary-4.14.7-v8
