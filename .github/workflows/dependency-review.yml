# Audit locked npm dependencies in this fork, where GitHub's dependency review
# API returns 403 for fork repositories.
name: 'Dependency Review'

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    if: github.event.pull_request.draft == false
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 'Detect dependency file changes'
        id: dependency_changes
        shell: bash
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only             "${{ github.event.pull_request.base.sha }}"             "${{ github.event.pull_request.head.sha }}")"

          printf '%s\n' "$changed_files"

          dependency_pattern='(^|/)(package\.json|yarn\.lock|package-lock\.json|npm-shrinkwrap\.json|pnpm-lock\.yaml|requirements[^/]*\.txt|Pipfile|Pipfile\.lock|poetry\.lock|pyproject\.toml|pom\.xml|build\.gradle|build\.gradle\.kts|go\.mod|go\.sum|Cargo\.toml|Cargo\.lock|composer\.json|composer\.lock|Gemfile|Gemfile\.lock)$'

          if printf '%s\n' "$changed_files" | grep -Eq "$dependency_pattern"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 'No dependency changes'
        if: steps.dependency_changes.outputs.changed != 'true'
        run: echo "No dependency manifests or lockfiles changed; dependency review API call is not required."

      - name: 'Dependency Review'
        if: steps.dependency_changes.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: 'Audit plugin dependencies'
        if: steps.dependency_changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          for package_dir in plugins/*; do
            if [ -f "$package_dir/yarn.lock" ]; then
              echo "Auditing $package_dir"
              yarn --cwd "$package_dir" audit --groups dependencies --level moderate
            fi
          done
